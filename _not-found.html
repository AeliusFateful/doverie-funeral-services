ейшие документы — гербовое свидетельство, справки, разрешения — мы оформляем за вас, без очередей и хождения по инстанциям."}},{"@type":"Question","name":"Вы работаете с кремацией и захоронением?","acceptedAnswer":{"@type":"Answer","text":"Да. Организуем кремацию в проверенных крематориях, передаём урну с прахом родственникам и помогаем с захоронением урны или традиционным погребением — в зависимости от ваших пожеланий."}},{"@type":"Question","name":"Можно ли организовать прощание по религиозным традициям?","acceptedAnswer":{"@type":"Answer","text":"Да, мы учитываем православные, мусульманские и другие традиции. Поможем с отпеванием, обрядовыми принадлежностями, выбором зала и временем церемонии в согласовании с храмом или мечетью."}},{"@type":"Question","name":"Что если я живу в другом городе?","acceptedAnswer":{"@type":"Answer","text":"Мы можем организовать похороны дистанционно: согласуем все детали по телефону или мессенджеру, оформим документы и проведём церемонию без вашего присутствия, держа вас в курсе на каждом этапе."}},{"@type":"Question","name":"Изготавливаете ли Вы гробы, урны, памятники и прочие изделия?","acceptedAnswer":{"@type":"Answer","text":"Да. В нашем салоне широкий ассортимент, а также изготовление на заказ — гробы, урны, памятники, ограды и другие изделия по вашему эскизу с учётом материала, формы и гравировки."}}]},{"@type":"Person","@id":"https://doverie-kemerovo.ru/#owner","name":"Сергей Равильевич Гусманов","jobTitle":"Владелец агентства «Доверие»","image":"https://doverie-kemerovo.ru/images/Sergey/Sergey.webp","worksFor":{"@id":"https://doverie-kemerovo.ru/#business"},"knowsAbout":["Организация похорон","Ритуальные услуги","Оформление документов","Кремация"]}]}</script><main class="min-h-dvh bg-background"><div class="mx-auto flex min-h-dvh max-w-site flex-col items-center gap-12 px-5 py-16 md:px-8 lg:flex-row lg:items-center lg:justify-between lg:gap-16"><div class="max-w-xl"><p class="section-label mb-5 flex items-center gap-3 text-acc и рядом.\",\"publisher\":{\"@type\":\"Organization\",\"name\":\"2ГИС\"}},{\"@type\":\"Review\",\"author\":{\"@type\":\"Person\",\"name\":\"Сергей В.\"},\"reviewRating\":{\"@type\":\"Rating\",\"ratingValue\":5,\"bestRating\":5},\"reviewBody\":\"Цену назвали сразу и не изменили ни на рубль. Всё честно, по договору, с чеком. Организовали прощание достойно и спокойно. Рекомендую людям, попавшим в беду.\",\"publisher\":{\"@type\":\"Organization\",\"name\":\"2ГИС\"}},{\"@type\":\"Review\",\"author\":{\"@type\":\"Person\",\"name\":\"Наталья К.\"},\"reviewRating\":{\"@type\":\"Rating\",\"ratingValue\":5,\"bestRating\":5},\"reviewBody\":\"Заказывали памятник и благоустройство. Сделали красиво, гравировка идеальная, установили в срок. Отдельное спасибо за терпение и человеческое отношение к нашей семье.\",\"publisher\":{\"@type\":\"Organization\",\"name\":\"2ГИС\"}},{\"@type\":\"Review\",\"author\":{\"@type\":\"Person\",\"name\":\"Дмитрий А.\"},\"reviewRating\":{\"@type\":\"Rating\",\"ratingValue\":5,\"bestRating\":5},\"reviewBody\":\"Обратились по рекомендации и не пожалели. Один специалист вёл нас от начала и до конца, всегда на связи. Чувствуется опыт и уважение к людям.\",\"publisher\":{\"@type\":\"Organization\",\"name\":\"2ГИС\"}}]},{\"@type\":\"FAQPage\",\"@id\":\"https://doverie-kemerovo.ru/#faq\",\"mainEntity\":[{\"@type\":\"Question\",\"name\":\"Что делать в первую очередь, если умер близкий?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Позвоните нам в любое время суток. Мы бесплатно проконсультируем, подскажем порядок действий и в течение 30–40 минут направим агента, который возьмёт на себя вызов врача, полиции (при необходимости) и транспортировку.\"}},{\"@type\":\"Question\",\"name\":\"Сколько стоят организация похорон и Ваши услуги?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Стоимость зависит от выбранного набора услуг и товаров. Мы согласовываем полную смету заранее и фиксируем её в договоре — итоговая сумма не меняется. Есть варианты для любого бюджета, включая социальные похороны.\"}},{\"@type\":\"Question\",\"name\":\"В какое время Вам можно позвонить?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"В любое время — наша диспетчерская и выездные агенты работают 24 часа в сутки, 7 дней в неделю, включая праздники. Звонок и первичная консультация бесплатны.\"}},{\"@type\":\"Question\",\"name\":\"Какие документы нужны и кто их оформляет?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Понадобятся паспорт умершего и заявителя, медицинское свидетельство о смерти. Все дальнейшие документы — гербовое свидетельство, справки, разрешения — мы оформляем за вас, без очередей и хождения по инстанциям.\"}},{\"@type\":\"Question\",\"name\":\"Вы работаете с кремацией и захоронением?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Да. Организуем кремацию в проверенных крематориях, передаём урну с прахом родственникам и помогаем с захоронением урны или традиционным погребением — в зависимости от ваших пожеланий.\"}},{\"@type\":\"Question\",\"name\":\"Можно ли организовать прощание по религиозным традициям?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Да, мы учитываем православные, мусульманские и другие традиции. Поможем с отпеванием, обрядовыми принадлежностями, выбором зала и временем церемонии в согласовании с храмом или мечетью.\"}},{\"@type\":\"Question\",\"name\":\"Что если я живу в другом городе?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Мы можем организовать похороны дистанционно: согласуем все детали по телефону или мессенджеру, оформим документы и проведём церемонию без вашего присутствия, держа вас в курсе на каждом этапе.\"}},{\"@type\":\"Question\",\"name\":\"Изготавливаете ли Вы гробы, урны, памятники и прочие изделия?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Да. В нашем салоне широкий ассортимент, а также изготовление на заказ — гробы, урны, памятники, ограды и другие изделия по вашему эскизу с учётом материала, формы и гравировки.\"}}]},{\"@type\":\"P
